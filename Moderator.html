<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Moderators</title>
</head>
<body>
    <h1 class="textAnim">Welcome to the moderator only page</h1>
    <h3 class="textAnim">This is for people who help out with the website</h3>
    <h3 class="textAnim">People can help in many ways such as, Helping me code, or creating artwork to use as buttons or favicons</h3>
    <h3 class="textAnim">If you are not a mod, this page serves no help to you.</h3>

<script>
    let m = false;
    let q = false;
    let z = false;

    document.addEventListener('keydown', function(event) {
        if (event.key === 'm') {
            m = true;
        } else if (event.key === 'q') {
            q = true;
        } else if (event.key === 'z') {
            z = true;
        } else {
            m = false;
            q = false;
            z = false;
        }
        if (m === true && q === true && z === true) {
            window.location.href = "modpage.html";
            m = false;
            q = false;
        }
    });

</script>
</body>
</html>
